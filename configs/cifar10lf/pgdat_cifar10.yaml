
method: pgdat
method_opt:
  label_smoothing: 0.

# dataset
augment: base
data: cifar10lf
imbalance_rate: 50

# model
model: wrn-28-10
classifier: FC
classifier_opt: ~

# optimizer
batch_size: 128
batch_size_validation: 128
num_epochs: 100
lr: 0.1
scheduler: step
scheduler_opt:
  gamma: 0.1
  milestones:
    - 75
    - 90



