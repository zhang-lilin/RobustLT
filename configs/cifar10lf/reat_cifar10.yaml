
method: reat
method_opt:
  label_smoothing: 0.

# dataset
augment: base
data: cifar10lf
imbalance_rate: 50

# model
model: wrn-28-10
classifier: FC
classifier_opt: ~

# optimizer
num_epochs: 80
lr: 0.1
batch_size: 128
test_batch_size: 128
scheduler: step
scheduler_opt:
  gamma: 0.1
  milestones:
    - 60
    - 75


