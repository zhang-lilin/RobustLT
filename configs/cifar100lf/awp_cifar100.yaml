
method: awp
method_opt:
  label_smoothing: 0.
  awp_gamma: 0.005
  awp_warmup: 0

# dataset
augment: base
data: cifar100lf
imbalance_rate: 10

# model
model: wrn-28-10
classifier: FC
classifier_opt: ~

# optimizer
batch_size: 128
batch_size_validation: 128
num_epochs: 200
lr: 0.1
scheduler: step
scheduler_opt:
  gamma: 0.1
  milestones:
    - 100
    - 150



