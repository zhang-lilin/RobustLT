
method: taet
method_opt:
  ce_epochs: 40
  alpha: 0.1
  beta: 0.1
  gamma: 0.1
  label_smoothing: 0.

# dataset
augment: base
data: cifar100lf
imbalance_rate: 10

# model
model: wrn-28-10
classifier: FC
classifier_opt: ~

# optimizer
num_epochs: 100
lr: 0.1
batch_size: 128
test_batch_size: 128
scheduler: step
scheduler_opt:
  gamma: 0.1
  milestones:
    - 75
    - 90


