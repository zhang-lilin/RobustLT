
method: robustlt_reat
method_opt:
  label_smoothing: 0.
  robustlt_alpha: 0.4
  robustlt_beta: 0.4

# dataset
augment: base
data: tinylf
imbalance_rate: 10

# model
model: wrn-28-10
classifier: FC
classifier_opt: ~

# optimizer
num_epochs: 80
lr: 0.1
batch_size: 128
test_batch_size: 128
scheduler: step
scheduler_opt:
  gamma: 0.1
  milestones:
    - 60
    - 75



